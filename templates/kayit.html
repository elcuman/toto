{% extends "base.html" %}

{% block title %}Kayıt · Tahmin Ligi{% endblock %}

{% block content %}

<div style="max-width: 450px; margin: 40px auto;">

    <div class="card">

        <h1 style="text-align: center; margin-bottom: 20px;">
            Hesap Oluştur
        </h1>

        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Arkadaşlarınla tahmin yarışına katıl.
        </p>

        <form method="POST">

            <label>
                Kullanıcı adı
            </label>

            <input 
                name="kullanici_adi"
                required
                minlength="3"
                maxlength="30"
                autocomplete="username"
                placeholder="Örn. Huseyin"
            >

            <label>
                Şifre
            </label>

            <input 
                type="password"
                name="sifre"
                required
                minlength="6"
                autocomplete="new-password"
            >

            <label>
                Şifre tekrar
            </label>

            <input 
                type="password"
                name="sifre_tekrar"
                required
                minlength="6"
                autocomplete="new-password"
            >

            <button class="btn" style="width: 100%; margin-top: 10px;">
                Hesap Oluştur
            </button>

        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9em;">
            Zaten hesabın var mı? 
            <a href="{{ url_for('giris') }}" style="color: #2563eb; text-decoration: none;">
                Giriş yap
            </a>
        </div>

    </div>

</div>

{% endblock %}
