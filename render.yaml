databases:
  - name: tahmin-ligi-db
    plan: free            # kalıcı disk yerine yönetilen Postgres kullanır, DB asla sıfırlanmaz
    databaseName: tahmin_ligi
    user: tahmin_ligi_user
    region: frankfurt      # Türkiye'ye en yakın Render bölgesi

services:
  # --- WEB SERVİSİ ---
  - type: web
    name: tahmin-ligi-web
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tahmin-ligi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FOOTBALL_DATA_TOKEN
        sync: false          # Render Dashboard'dan elle gireceksin
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # Render Dashboard'dan elle gireceksin (güçlü bir şifre koy)
      - key: CRON_SECRET
        generateValue: true  # cron job bu değeri otomatik okuyacak (aşağıya bak)
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- CRON JOB: maç verilerini otomatik senkronize eder ---
  - type: cron
    name: tahmin-ligi-sync-cron
    runtime: python
    plan: free
    region: frankfurt
    schedule: "0 */6 * * *"   # her 6 saatte bir (UTC). Dilersen değiştir: "0 3 * * *" -> her gün 03:00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: >
      curl -sf -X POST
      -H "X-Cron-Secret: $CRON_SECRET"
      "$WEB_SERVICE_URL/cron/sync"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: tahmin-ligi-web
          envVarKey: CRON_SECRET
      - key: WEB_SERVICE_URL
        value: https://tahmin-ligi-web.onrender.com   # web servisin gerçek Render URL'i ile değiştir
